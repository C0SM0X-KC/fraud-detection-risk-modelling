# The accent marks what the model judged; streamlit paints selections and
# controls in primaryColor, so it stays the same blue as the margin marks.
[theme]
base = "dark"
primaryColor = "#4F9CF9"
backgroundColor = "#0F141C"
secondaryBackgroundColor = "#131A24"
textColor = "#A8B2C1"

[server]
headless = true

[browser]
gatherUsageStats = false
