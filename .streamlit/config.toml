# The accent has one job: it marks what the model flagged, the way a reviewer
# marks a ledger. Streamlit paints selections and controls in primaryColor, so
# setting it here keeps those in the same pen red as the margin strokes.
[theme]
base = "light"
primaryColor = "#B3261E"
backgroundColor = "#F3F5F0"
secondaryBackgroundColor = "#E2EADC"
textColor = "#1B1F1B"

[server]
headless = true

[browser]
gatherUsageStats = false
