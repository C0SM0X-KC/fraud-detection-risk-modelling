# One image, several roles; the repository is mounted at /app.
#
#   docker compose build
#   docker compose run --rm frds python -m frds all        # the pipeline
#   docker compose run --rm frds python -m pytest -q       # the tests
#   docker compose up api dashboard                        # the product
#   docker compose --profile stream up                     # + Kafka transport

# Only `api` builds the image; every other service reuses it, so a build runs
# once instead of once per service.
x-frds: &frds
  image: frds:latest
  pull_policy: never
  volumes:
    - .:/app
  env_file:
    - path: .env
      required: false

services:
  frds:
    <<: *frds
    profiles: ["tools"]

  # `docker compose build` builds the image; `up` then reuses it rather than
  # rebuilding on every start.
  api:
    <<: *frds
    build: .
    command: uvicorn serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  dashboard:
    <<: *frds
    command: >
      streamlit run serving/dashboard.py
      --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"

  kafka:
    image: apache/kafka:3.8.0
    profiles: ["stream"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  stream:
    <<: *frds
    profiles: ["stream"]
    depends_on: [kafka]
    command: python -m frds stream --transport kafka --bootstrap kafka:9092
