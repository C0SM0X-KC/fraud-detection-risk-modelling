# Fraud detection and risk modelling: the configuration for every stage.

project:
  name: frds
  seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  artifacts: artifacts
  reports: reports

data:
  # IEEE-CIS Fraud Detection (primary benchmark, report Table 4.4)
  dataset: ieee_cis
  transaction_file: train_transaction.csv
  identity_file: train_identity.csv
  id_col: TransactionID
  time_col: TransactionDT
  target_col: isFraud
  amount_col: TransactionAmt
  # Reference epoch for TransactionDT (seconds offset). Used only to derive
  # calendar features; the absolute date is not needed for the split.
  dt_origin_days: 0
  # Set to a positive integer to work on a chronological head of the data
  # while developing. null = use every row.
  sample_rows: null

split:
  # Report objective 1: strictly chronological, no future leakage.
  strategy: chronological
  train_frac: 0.70   # first 70% of the timeline
  valid_frac: 0.10   # next 10%   -> meta-learner + calibration fitting
  test_frac: 0.20    # final 20%  -> reported metrics only
  # Expanding-window folds inside the train span, used to produce the
  # out-of-fold base-model predictions the stacker consumes.
  n_oof_folds: 5
  # After early stopping, refit on train + the earlier part of validation (closest to test).
  refit_on_valid: true
  # Share of validation held back from the refit; calibration and score selection use it.
  calibration_holdout_frac: 0.3
  # Fewer fraud cases than this in the holdout: skip the refit, calibrate on all of validation.
  min_calibration_positives: 200

features:
  # Entity keys used for velocity counters and for the heterogeneous graph.
  entity_keys:
    card: [card1, card2, card3, card5]
    address: [addr1, addr2]
    email: [P_emaildomain, R_emaildomain]
    device: [DeviceInfo, DeviceType]
  # Synthetic account identifier: the IEEE-CIS convention of anchoring a card
  # to its first-seen day via D1. Gives a far better entity than card1 alone.
  uid_components: [card1, addr1, P_emaildomain]
  velocity_windows_hours: [1, 24, 168]     # 1 hour, 1 day, 1 week
  rolling_amount_windows: [5, 20]          # last-N transactions per entity
  min_category_frequency: 20               # rarer levels collapse to __rare__
  max_v_columns: 120                       # V1..V339 reduced by NaN-group + corr
  # Days before a label reaches the target-encoding features (0 = known immediately).
  label_delay_days: 0
  # Drop the per-entity prior-fraud-rate features altogether (ablation).
  disable_target_encoding: false
  # Make time-growing features stationary (no day index, anchored D columns, rates).
  stationarise: true
  # Per-entity running means and this row's ratio to them (behavioural, not label-derived).
  entity_aggregates: true
  aggregate_entities: [uid, card, device]
  aggregate_value_columns: [TransactionAmt, D2, D10, D15, C1, C13]
  # Per-account profile features; evaluated and not adopted (report section 4.11).
  account_profile: false
  profile_value_columns: [C2, C5, C6, C9, C11, C14, D1, D3, D4, D5, D11, dist1,
                          V258, V294, V307, V317, id_02]
  drop_null_threshold: 0.90                # drop columns with >90% missing

imbalance:
  # Report Table 4.1 step A.5: training fold only, never validation or test.
  method: class_weight                     # class_weight | smote | adasyn | none
  sampling_strategy: 0.10                  # minority:majority ratio if resampling
  # Half-life in days for down-weighting older training rows; null disables it.
  recency_half_life_days: null

models:
  # Tiers in the benchmark. Optional: 'tcn' (sequence head), 'tabpfn' (pip install tabpfn).
  enabled: [logistic_regression, random_forest, xgboost, lightgbm, catboost, lstm, hetero_gnn]
  logistic_regression:
    C: 0.1
    max_iter: 2000
  random_forest:
    n_estimators: 300
    max_depth: 18
    min_samples_leaf: 20
    n_jobs: -1
  xgboost:
    n_estimators: 2000
    learning_rate: 0.03
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.6
    min_child_weight: 5
    reg_lambda: 1.0
    early_stopping_rounds: 100
    tree_method: hist
  lightgbm:
    n_estimators: 3000
    learning_rate: 0.03
    num_leaves: 128
    min_child_samples: 50
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.6
    reg_lambda: 1.0
    early_stopping_rounds: 100
  # Hand-set like the other boosters; Optuna tuning did not transfer to test.
  catboost:
    n_estimators: 3000
    learning_rate: 0.05
    depth: 8
    l2_leaf_reg: 3.0
    early_stopping_rounds: 100
  # lstm and hetero_gnn: chosen on validation by scripts/tune_deep_tiers.py.
  lstm:
    entity: uid          # sequences are built per synthetic account
    window: 24           # transactions of history shown to the model
    hidden: 128
    dropout: 0.2
    epochs: 25
    batch_size: 1024
    lr: 0.001
  tcn:
    entity: uid
    window: 12
    hidden: 64
    dropout: 0.2
    epochs: 12
    batch_size: 1024
    lr: 0.001
  hetero_gnn:
    relations: [card, merchant, device, address, email]
    hidden: 64
    dropout: 0.2
    memory_decay: 0.8    # share of an entity's past state kept per update
    epochs: 20
    batch_size: 2048
    lr: 0.002
  tabpfn:
    context_size: 8000           # published operating range, not a tuning knob
    max_features: 100
    negatives_per_positive: 8
    batch_size: 2000

tuning:
  # `python -m frds tune` runs an Optuna TPE search on the validation fold and
  # writes artifacts/tuned_params.json. use_tuned makes training use it.
  use_tuned: false
  n_trials: 30
  timeout_seconds: 3600              # per model
  negative_sample_frac: 0.3          # training negatives kept during the search

fusion:
  meta_learner: logistic_regression        # trained on out-of-fold base scores
  calibration: isotonic                    # report section 4.6
  # Use whichever score wins on validation; the stack is always fitted and reported.
  select_on_validation: true
  # Below this many fraud cases in the calibration set, isotonic regression
  # fits noise; Platt scaling is used instead.
  isotonic_min_positives: 500
  # Below this, no calibration curve can be estimated at all and the score
  # is left uncalibrated rather than distorted.
  min_calibration_positives: 50

risk:
  # Report Table 4.3
  score_min: 0
  score_max: 100
  tiers:
    low:    {lo: 0,  hi: 29,  action: auto_approve}
    medium: {lo: 30, hi: 69,  action: step_up_auth}
    high:   {lo: 70, hi: 100, action: manual_review}
  # Cost-sensitive threshold search (report section 4.6):
  # flag when p * C_FN > (1 - p) * C_FP.
  cost_fn_multiplier: 1.0                  # C_FN = multiplier * transaction amount
  cost_fp_fixed: 25.0                      # C_FP = review effort + goodwill, currency units
  daily_review_capacity_pct: 0.005         # analyst budget as fraction of daily volume

evaluation:
  primary_metric: auc_pr
  fpr_targets: [0.001, 0.005, 0.01, 0.05]  # recall @ fixed FPR
  psi_windows: 6                           # temporal windows for drift
  psi_bins: 10
  psi_alert_threshold: 0.25
  latency_sample_size: 5000
  # p95 target for the product path (online features to decision); reasons timed separately.
  latency_target_ms: 100
  latency_single_samples: 500
  latency_batch_size: 256
  shap_max_display: 15
  shap_background_size: 2000

robustness:
  # `python -m frds robustness`: features an attacker controls through their own transaction.
  mutable_features:
    - "^amt_"
    - "^TransactionAmt$"
    - "^roll_.*_amt_(z|ratio)$"
    - "^agg_.*_TransactionAmt_ratio$"
    - "^txn_hour$"
    - "^mismatch_"
    - "^missing_(r_email|device|geo)$"
    - "^dist[12]$"
    - "^(freq|cat)_(P_emaildomain|R_emaildomain|DeviceInfo|DeviceType)$"
    - "^(freq|cat)_id_"
    - "^id_"
  # Budget in training std devs; 0.0 is a control for the encode/decode round trip.
  epsilons: [0.0, 0.1, 0.25, 0.5, 1.0]
  pgd_steps: 30
  max_attacked: 2000                  # caught frauds attacked per setting

transfer:
  # `python -m frds baf`: the same protocol on the Bank Account Fraud suite
  # (report Table 3.4, secondary dataset).
  baf_file: baf/Base.csv
  target_col: fraud_bool
  month_col: month
  train_months: [0, 1, 2, 3, 4, 5]
  valid_months: [6]
  test_months: [7]
  models: [logistic_regression, xgboost, lightgbm]
  # BAF's own fairness check: false-positive-rate parity between applicants
  # under and over this age, at the threshold giving 5 % overall FPR.
  fairness_age_threshold: 50
  fairness_fpr: 0.05

tracking:
  # MLflow experiment tracking (report Table 4.6). Off by default; needs
  # `pip install mlflow-skinny`. Runs are written under mlruns/.
  mlflow: false
  uri: mlruns
  experiment: frds
